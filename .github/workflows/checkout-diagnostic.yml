name: AetherOS Docker Smoke

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker smoke
        run: |
          set -eux
          docker --version
          docker run --rm hello-world
