name: AetherOS Production Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          set -eux
          docker pull skylyrac/blocksds:slim-latest
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work skylyrac/blocksds:slim-latest bash -c 'COMPILER=$(find /opt/wonderful -type f -name arm-none-eabi-gcc | head -1); test -n "$COMPILER"; export PATH="$(dirname "$COMPILER"):$PATH"; arm-none-eabi-gcc --version | head -1; make'
      - name: Check output
        run: |
          set -eux
          test -s AetherOS5.nds
          stat -c '%s bytes' AetherOS5.nds
          python3 - <<'PY'
from pathlib import Path
p=Path("AetherOS5.nds").read_bytes()
assert len(p) > 0
assert len(p) <= 64*1024*1024
assert p[0x12] == 2, f"DSi unit code={p[0x12]}"
arm9_off=int.from_bytes(p[0x20:0x24],"little")
arm9_size=int.from_bytes(p[0x2c:0x30],"little")
assert arm9_off > 0 and arm9_size > 0 and arm9_off + arm9_size <= len(p)
print("VERIFIED_NDS_SIZE",len(p))
print("VERIFIED_DSI_UNIT_CODE",p[0x12])
print("VERIFIED_ARM9_SIZE",arm9_size)
PY
          grep -Fq '#define APP_COUNT 79' source/aetherosq.c
          grep -Fq 'mode>=30&&mode<=77' source/aetherosq.c
          grep -Fq '"CAMERA & MIC"' source/aetherosq.c
          grep -Fq 'modCamera' source/aetherosq.c
      - name: Upload verified NDS
        uses: actions/upload-artifact@v4
        with:
          name: AetherOS5-DSi-Verified
          if-no-files-found: error
          path: AetherOS5.nds
