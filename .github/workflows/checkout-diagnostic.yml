name: AetherOS Production Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          set -eux
          docker pull skylyrac/blocksds:slim-latest
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work skylyrac/blocksds:slim-latest bash -c 'COMPILER=$(find /opt/wonderful -type f -name arm-none-eabi-gcc | head -1); test -n "$COMPILER"; export PATH="$(dirname "$COMPILER"):$PATH"; arm-none-eabi-gcc --version | head -1; make'
      - name: Validate
        run: |
          bash ci/validate-aetheros5.sh
          test -s UniverseSimulatorPlus.nds
          cp UniverseSimulatorPlus.nds AetherOS-UniverseSimulatorPlus.nds
          test -s AetherOS-UniverseSimulatorPlus.nds
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: UniverseSimulatorPlus-DSi-Verified-Diagnostic
          if-no-files-found: error
          path: |
            UniverseSimulatorPlus.nds
            AetherOS-UniverseSimulatorPlus.nds
