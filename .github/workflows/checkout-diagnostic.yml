name: AetherOS Production Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          set -eux
          docker pull skylyrac/blocksds:slim-latest
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work skylyrac/blocksds:slim-latest sh -c '. /opt/wonderful/bin/wf-env && make'
      - name: Check output
        run: |
          set -eux
          test -s AetherOS5.nds
          stat -c '%s bytes' AetherOS5.nds
