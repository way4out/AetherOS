name: AetherOS Production Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build AetherOS 5
        run: |
          set -eux
          docker --version
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work skylyrac/blocksds:slim-latest make
      - name: Validate
        run: |
          set -eux
          test -s AetherOS5.nds
          python3 - <<'PY'
from pathlib import Path
p=Path("AetherOS5.nds").read_bytes()
assert p[0x12] == 2, p[0x12]
a=int.from_bytes(p[0x20:0x24],"little")
s=int.from_bytes(p[0x2c:0x30],"little")
assert a > 0 and s > 0 and a+s <= len(p)
assert len(p) <= 64*1024*1024
print("VERIFIED_NDS_SIZE", len(p))
print("VERIFIED_DSI_UNIT_CODE", p[0x12])
print("VERIFIED_ARM9_SIZE", s)
PY
          grep -Fq '#define APP_COUNT 79' source/aetherosq.c
          grep -Fq 'mode>=30&&mode<=77' source/aetherosq.c
          grep -Fq '"CAMERA & MIC"' source/aetherosq.c
      - name: Upload NDS
        uses: actions/upload-artifact@v4
        with:
          name: AetherOS5-DSi-Verified
          if-no-files-found: error
          path: AetherOS5.nds
