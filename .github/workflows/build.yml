name: Build AetherMod 8.2 Pass 2 for Nintendo DSi
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build AetherMod 8.2
        run: |
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"
          make clean
          mkdir -p build/include
          make
          test -f AetherMod8.3.nds
          cp AetherMod8.3.nds AetherOS8.3.nds
          file AetherMod8.3.nds || true
          ls -lh AetherMod8.3.nds AetherOS8.3.nds
      - name: Package complete SD bundle
        run: |
          mkdir -p deploy/apps/AetherMod
          mkdir -p deploy/data/AetherMod
          cp AetherMod8.3.nds deploy/apps/AetherMod/AetherMod8.3.nds
          cp AetherOS8.3.nds deploy/apps/AetherMod/AetherOS8.3.nds
          cp -r data/AetherMod/. deploy/data/AetherMod/
          cp AETHERMOD.md deploy/AETHERMOD.md
          printf '%s
' 'Copy apps/AetherMod and data/AetherMod to the DSi SD card. Launch AetherOS8.3.nds or AetherMod8.3.nds.' > deploy/INSTALL.txt
          cd deploy
          zip -r ../AetherOS8.3-Pass2-DSi-Public.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: AetherOS8.3-Pass2-DSi-Public
          path: |
            AetherMod8.3.nds
            AetherOS8.3.nds
            AetherOS8.3-Pass2-DSi-Public.zip
