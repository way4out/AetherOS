name: Build AetherCore 1 for Nintendo DSi

on:
  workflow_dispatch:
  push:
    branches: [ main, aetheros9-stable ]
  pull_request:
    branches: [ main, aetheros9-stable ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect toolchain
        run: |
          set -eu
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"
          "$DEVKITARM/bin/arm-none-eabi-gcc" --version | head -1
          test -f "$DEVKITARM/ds_rules"
          test -f "$DEVKITPRO/libnds/include/nds.h"

      - name: Clean and build real NDS
        run: |
          set -eu
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"
          make clean
          make
          test -s AetherCore1.nds
          ndstool -t AetherCore1.nds
          python3 - <<'PY'
          from pathlib import Path
          p=Path("AetherCore1.nds")
          b=p.read_bytes()
          assert len(b) > 65536, f"NDS unexpectedly small: {len(b)} bytes"
          assert b[0x0C:0x10] == b"####", f"unexpected game code: {b[0x0C:0x10]!r}"
          assert b[0x12] == 2, f"expected DSi unit code 2, got {b[0x12]}"
          assert int.from_bytes(b[0x20:0x24],"little") != 0, "ARM9 ROM offset missing"
          assert int.from_bytes(b[0x2C:0x30],"little") != 0, "ARM9 size missing"
          print(f"VERIFIED_NDS_SIZE={len(b)}")
          print(f"VERIFIED_DSI_UNIT_CODE={b[0x12]}")
          print("VERIFIED_ARM9_HEADER=present")
          PY
          sha256sum AetherCore1.nds
          ls -lh AetherCore1.nds

      - name: Static source sanity
        run: |
          set -eu
          grep -q 'AETHERCORE_MAJOR 1' source/aetherosq.c
          grep -q 'AETHERCORE_PASS 3' source/aetherosq.c
          grep -q 'AETHERMOD_MAJOR 9' source/aetherosq.c
          grep -q 'AETHER_SAVE_VERSION 7' source/aetherosq.c
          grep -q 'touchStartX' source/aetherosq.c
          grep -q 'diagStorageKnown' source/aetherosq.c
          grep -q 'AetherCore 1 / PASS 3' source/aetherosq.c
          grep -q '#define APP_COUNT 48' source/aetherosq.c
          grep -q 'EXECUTIVE SYSTEM' source/aetherosq.c

      - name: Emulator availability check
        run: |
          command -v desmume-cli || command -v desmume || command -v melonDS || true

      - name: Package complete SD bundle
        run: |
          set -eu
          mkdir -p deploy/apps/AetherMod deploy/data/AetherMod
          cp AetherCore1.nds deploy/apps/AetherMod/AetherCore1.nds
          cp -r data/AetherMod/. deploy/data/AetherMod/
          cp AETHERMOD.md deploy/AETHERMOD.md
          printf '%s\n' 'Copy apps/AetherMod and data/AetherMod to the DSi SD card. Launch AetherCore1.nds.' > deploy/INSTALL.txt
          cd deploy
          zip -r ../AetherCore1-DSi-Public.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: AetherCore1-DSi-Public
          if-no-files-found: error
          path: |
            AetherCore1.nds
            AetherCore1-DSi-Public.zip
