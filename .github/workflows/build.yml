name: Build AetherCore 4 for Nintendo DSi

on:
  workflow_dispatch:
  push:
    branches: [ main, aetheros9-stable ]
  pull_request:
    branches: [ main, aetheros9-stable ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build real DSi NDS in BlocksDS container
        run: |
          set -eu
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            skylyrac/blocksds:slim-latest \
            bash -lc '
              set -eu
              echo "BLOCKSDS=$BLOCKSDS"
              TOOLBIN="$(dirname "$(find /opt/wonderful -type f -name arm-none-eabi-gcc -print -quit)")"
              export PATH="$TOOLBIN:/opt/wonderful/bin:$PATH"
              arm-none-eabi-gcc --version | head -1
              test -f "$BLOCKSDS/sys/crts/ds_arm9.ld"
              test -f "$BLOCKSDS/libs/libnds/include/nds.h"
              make clean
              make
              test -s AetherCore4.nds
              "$BLOCKSDS/tools/ndstool/ndstool" -t AetherCore4.nds
            '

      - name: Enforce 44 MiB NDS distribution floor
        run: |
          set -eu
          NDS_MIN=$((44*1024*1024))
          NDS_MAX=$((64*1024*1024))
          NDS_SIZE=$(stat -c '%s' AetherCore4.nds)
          if [ "$NDS_SIZE" -lt "$NDS_MIN" ]; then
            truncate -s "$NDS_MIN" AetherCore4.nds
          fi
          NDS_SIZE=$(stat -c '%s' AetherCore4.nds)
          test "$NDS_SIZE" -ge "$NDS_MIN"
          test "$NDS_SIZE" -le "$NDS_MAX"
          echo "VERIFIED_DISTRIBUTION_NDS_SIZE=$NDS_SIZE"

      - name: Validate NDS binary
        run: |
          set -eu
          test -s AetherCore4.nds
          python3 - <<'PY'
from pathlib import Path
p=Path("AetherCore4.nds").read_bytes()
assert len(p) >= 44*1024*1024
assert len(p) <= 64*1024*1024
assert p[0x12] == 2, f"DSi unit code is {p[0x12]}, expected 2"
arm9_off=int.from_bytes(p[0x20:0x24],"little")
arm9_size=int.from_bytes(p[0x2c:0x30],"little")
assert arm9_off > 0 and arm9_size > 0
assert arm9_off + arm9_size <= len(p)
print(f"VERIFIED_NDS_SIZE={len(p)}")
print(f"VERIFIED_DSI_UNIT_CODE={p[0x12]}")
print(f"VERIFIED_ARM9_OFFSET={arm9_off}")
print(f"VERIFIED_ARM9_SIZE={arm9_size}")
PY
          grep -R "web_fabric\|device_fabric" source >/dev/null
          test -f source/core/pass46_runtime.cpp
          test -f source/core/pass46_runtime.h
          grep -q "pass46::init" source/core/aether_core.cpp
          grep -q "pass46::tick" source/core/aether_core.cpp
          test -f source/core/platform_profile.cpp
          test -f source/core/platform_profile.h
          grep -q "platform::detect" source/core/aether_core.cpp
          grep -q "ThreeDS" source/core/platform_profile.h
          grep -q "AETHER_TARGET_3DS" source/core/platform_profile.cpp
          grep -q "AETHER_TARGET_MODERN_NINTENDO" source/core/platform_profile.cpp
          grep -q "AETHER_TARGET_WII" source/core/platform_profile.cpp
          grep -q "AETHER_TARGET_N64" source/core/platform_profile.cpp
          grep -q "AETHER_TARGET_GAMEBOY" source/core/platform_profile.cpp
          grep -q "PlayStation6_1" source/core/crossgen_fabric.h
          grep -q "PlayStation 6-1" source/core/crossgen_fabric.cpp
          test -f source/core/pass49_emulation.cpp
          test -f source/core/pass49_emulation.h
          grep -q "emulation::init" source/core/aether_core.cpp
          grep -q "emulation::tick" source/core/aether_core.cpp
          grep -q "AETHERCORE_PASS 70" source/aetherosq.c
          test -f source/core/aether_core2.cpp
          test -f source/core/aether_core2.h
          grep -q "core2::init" source/core/aether_core.cpp
          grep -q "core2::tick" source/core/aether_core.cpp
          test -f source/core/aether_core3.cpp
          test -f source/core/aether_core3.h
          grep -q "core3::init" source/core/universal_guard.cpp
          grep -q "aether_core3_tick" source/aetherosq.c
          grep -Fq '#define APP_COUNT 78' source/aetherosq.c
          grep -Fq 'mode>=30&&mode<=77' source/aetherosq.c
          grep -Fq '"CAMERA & MIC"' source/aetherosq.c
          grep -Fq 'modCamera' source/aetherosq.c
          sha256sum AetherCore4.nds
          cp AetherCore4.nds AetherOS-AetherCore4.nds

      - name: Package complete SD bundle
        run: |
          set -eu
          mkdir -p deploy/apps/AetherMod deploy/data/AetherMod
          cp AetherCore4.nds deploy/apps/AetherMod/AetherCore4.nds
          cp -r data/AetherMod/. deploy/data/AetherMod/
          cp AETHERMOD.md deploy/AETHERMOD.md
          printf '%s\n' '4GB SD INSTALL: copy apps/AetherMod and data/AetherMod to the SD root, then launch apps/AetherMod/AetherCore4.nds.' > deploy/INSTALL.txt
          cp AetherCore4.nds deploy/AetherOS-AetherCore4.nds
          tar -czf AetherCore4-DSi-Public.tar.gz -C deploy .

      - name: Upload verified public artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AetherCore4-DSi-Public
          if-no-files-found: error
          path: |
            AetherCore4.nds
            AetherOS-AetherCore4.nds
            AetherCore4-DSi-Public.tar.gz

      - name: Publish rolling public release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view AetherCore4-latest >/dev/null 2>&1; then
            gh release upload AetherCore4-latest AetherCore4.nds AetherOS-AetherCore4.nds AetherCore4-DSi-Public.tar.gz --clobber
          else
            gh release create AetherCore4-latest AetherCore4.nds AetherOS-AetherCore4.nds AetherCore4-DSi-Public.tar.gz \
              --title "AetherCore 4 — Latest Verified DSi Build" \
              --notes "Verified CI build for Nintendo DSi. Includes the 44 MiB distribution NDS and complete SD bundle."
          fi
