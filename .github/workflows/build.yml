name: Build AetherMod 7.0 Apex Pass 3 for Nintendo DSi
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20241104
    steps:
      - uses: actions/checkout@v4
      - name: Build AetherMod
        run: |
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"
          make clean
          mkdir -p build/include
          cp source/AetherMod_Pass4_Final.c source/aetherosq.c
          rm -f source/AetherMod_Pass4.c source/AetherMod_Pass4_Final.c
          cp include/pass4_prototypes.h build/include/pass4_prototypes.h
          sed -i "s/static long long calcResult/long long calcResult/" source/aetherosq.c
          sed -i "s/static void dawStepAdvance/void dawStepAdvance/" source/aetherosq.c
          make
          test -f AetherMod.nds
          file AetherMod.nds || true
          ls -lh AetherMod.nds
      - name: Package complete SD bundle
        run: |
          mkdir -p deploy/apps/AetherMod
          mkdir -p deploy/data/AetherMod
          cp AetherMod.nds deploy/apps/AetherMod/AetherMod.nds
          cp -r data/AetherMod/. deploy/data/AetherMod/
          cp AETHERMOD.md deploy/AETHERMOD.md
          printf '%s\n' 'Copy the apps/AetherMod and data/AetherMod directories to the DSi SD card.' > deploy/INSTALL.txt
          cd deploy
          zip -r ../AetherMod-7.0-Apex-Pass4-DSi-Full-Rollout.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: AetherMod-7.0-Apex-Pass4-DSi-Full-Rollout
          path: |
            AetherMod.nds
            AetherMod-7.0-Apex-Pass4-DSi-Full-Rollout.zip
