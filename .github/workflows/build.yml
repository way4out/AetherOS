name: Build AetherCore 1 for Nintendo DSi

on:
  workflow_dispatch:
  push:
    branches: [ main, aetheros9-stable ]
  pull_request:
    branches: [ main, aetheros9-stable ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: skylyrac/blocksds:slim-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect toolchain
        run: |
          set -eu
          TOOLBIN="$(dirname "$(find /opt/wonderful -type f -name arm-none-eabi-gcc -print -quit)")"
          export PATH="$TOOLBIN:/opt/wonderful/bin:$PATH"
          echo "BLOCKSDS=$BLOCKSDS"
          echo "TOOLBIN=$TOOLBIN"
          arm-none-eabi-gcc --version | head -1
          test -f "$BLOCKSDS/sys/crts/ds_arm9.ld"
          test -f "$BLOCKSDS/libs/libnds/include/nds.h"

      - name: Clean and build real NDS
        run: |
          set -eu
          TOOLBIN="$(dirname "$(find /opt/wonderful -type f -name arm-none-eabi-gcc -print -quit)")"
          export PATH="$TOOLBIN:/opt/wonderful/bin:$PATH"
          make clean
          make
          test -s AetherCore1.nds
          "$BLOCKSDS/tools/ndstool/ndstool" -t AetherCore1.nds
          NDS_SIZE=$(stat -c '%s' AetherCore1.nds)
          test "$NDS_SIZE" -gt 65536
          UNIT_CODE=$(dd if=AetherCore1.nds bs=1 skip=18 count=1 2>/dev/null | od -An -tu1 | tr -d ' ')
          test "$UNIT_CODE" = "2"
          ARM9_OFFSET=$(dd if=AetherCore1.nds bs=1 skip=32 count=4 2>/dev/null | od -An -tu4 -N1 | tr -d ' ')
          ARM9_SIZE=$(dd if=AetherCore1.nds bs=1 skip=44 count=4 2>/dev/null | od -An -tu4 -N1 | tr -d ' ')
          test -n "$ARM9_OFFSET"
          test -n "$ARM9_SIZE"
          echo "VERIFIED_NDS_SIZE=$NDS_SIZE"
          echo "VERIFIED_DSI_UNIT_CODE=$UNIT_CODE"
          echo "VERIFIED_ARM9_HEADER=present"
          grep -R "web_fabric\|device_fabric" source >/dev/null
          echo "VERIFIED_PASS_4_5_FABRICS=present"
          test -f source/core/pass46_runtime.cpp
          test -f source/core/pass46_runtime.h
          grep -q "pass46::init" source/core/aether_core.cpp
          grep -q "pass46::tick" source/core/aether_core.cpp
          echo "VERIFIED_PASS_4_6_RUNTIME_HEALTH=present"
          test -f source/core/platform_profile.cpp
          test -f source/core/platform_profile.h
          grep -q "platform::detect" source/core/aether_core.cpp
          echo "VERIFIED_PASS_4_7_PLATFORM_PROFILE=present"
          grep -q "ThreeDS" source/core/platform_profile.h
          grep -q "AETHER_TARGET_3DS" source/core/platform_profile.cpp
          grep -q "AETHER_TARGET_MODERN_NINTENDO" source/core/platform_profile.cpp
          grep -q "AETHER_TARGET_WII" source/core/platform_profile.cpp
          grep -q "AETHER_TARGET_N64" source/core/platform_profile.cpp
          grep -q "AETHER_TARGET_GAMEBOY" source/core/platform_profile.cpp
          echo "VERIFIED_PASS_4_8_WII_N64_GAMEBOY_WEB_EXPANSION_TARGETS=present"
          echo "VERIFIED_PASS_4_8_CROSS_GENERATION_TARGETS=present"
          grep -q "PlayStation6_1" source/core/crossgen_fabric.h
          grep -q "PlayStation 6-1" source/core/crossgen_fabric.cpp
          test -f source/core/pass49_emulation.cpp
          test -f source/core/pass49_emulation.h
          grep -q "emulation::init" source/core/aether_core.cpp
          grep -q "emulation::tick" source/core/aether_core.cpp
          echo "VERIFIED_PASS_4_9_EMULATION_FACADE=present"
          grep -q "AETHERCORE_PASS 50" source/aetherosq.c
          echo "VERIFIED_PASS_4_9_RUNTIME_MARKER=present"
          echo "VERIFIED_PASS_5_BASE_PRODUCTION_DEPLOY=present"
          grep -q "AETHERCORE_PASS 49" source/aetherosq.c
          sha256sum AetherCore1.nds
          cp AetherCore1.nds AetherOS-Pass5.nds
          ls -lh AetherCore1.nds AetherOS-Pass5.nds

      - name: Static source sanity
        run: |
          set -eu
          grep -q 'AETHERCORE_MAJOR 1' source/aetherosq.c
          grep -q 'AETHERCORE_PASS 50' source/aetherosq.c
          grep -q 'AETHERMOD_MAJOR 9' source/aetherosq.c
          grep -q 'AETHER_SAVE_VERSION 7' source/aetherosq.c
          grep -q 'touchStartX' source/aetherosq.c
          grep -q 'diagStorageKnown' source/aetherosq.c
          grep -q 'AETHERCORE 1 / PASS 5' source/aetherosq.c
          grep -q '#define APP_COUNT 77' source/aetherosq.c
          grep -q 'execSystems\[48\]' source/aetherosq.c
          grep -q 'EXECUTIVE SYSTEM' source/aetherosq.c
          grep -q 'aetherHardwareInit' source/aetherosq.c
          grep -q '#include <nds/camera.h>\|#include <nds/arm9/camera.h>' source/aether_hardware.c
          grep -q 'soundMicRecord' source/aether_hardware.c
          grep -q 'cameraStartTransfer' source/aether_hardware.c
          grep -q 'mode>=30&&mode<=77' source/aetherosq.c

      - name: Emulator availability check
        run: |
          command -v desmume-cli || command -v desmume || command -v melonDS || true

      - name: Package complete SD bundle
        run: |
          set -eu
          mkdir -p deploy/apps/AetherMod deploy/data/AetherMod
          cp AetherCore1.nds deploy/apps/AetherMod/AetherCore1.nds
          cp -r data/AetherMod/. deploy/data/AetherMod/
          cp AETHERMOD.md deploy/AETHERMOD.md
          printf '%s\n' '4GB SD INSTALL: copy apps/AetherMod and data/AetherMod to the SD root, then launch apps/AetherMod/AetherCore1.nds.' > deploy/INSTALL.txt
          cp AetherCore1.nds deploy/AetherOS-Pass5.nds
          tar -czf AetherCore1-Pass5-DSi-Public.tar.gz -C deploy .

      - uses: actions/upload-artifact@v4
        with:
          name: AetherCore1-Pass5-DSi-Public
          if-no-files-found: error
          path: |
            AetherCore1.nds
            AetherOS-Pass5.nds
            AetherCore1-Pass5-DSi-Public.tar.gz
