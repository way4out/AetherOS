name: Build AetherOS 8.7 Pass 3 for Nintendo DSi
on:
  workflow_dispatch:
  push:
    branches: [ main, aetheros8.7-pass1, aetheros8.7-pass3 ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build AetherOS 8.7
        run: |
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"
          make clean
          make
          test -s AetherOS8.7.nds
          file AetherOS8.7.nds || true
          ls -lh AetherOS8.7.nds
      - name: Package complete SD bundle
        run: |
          mkdir -p deploy/apps/AetherMod
          mkdir -p deploy/data/AetherMod
          cp AetherOS8.7.nds deploy/apps/AetherMod/AetherOS8.7.nds
          cp -r data/AetherMod/. deploy/data/AetherMod/
          cp AETHERMOD.md deploy/AETHERMOD.md
          printf '%s\n' 'Copy apps/AetherMod and data/AetherMod to the DSi SD card. Launch AetherOS8.7.nds.' > deploy/INSTALL.txt
          cd deploy
          zip -r ../AetherOS8.7-Pass3-DSi-Public.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: AetherOS8.7-Pass3-DSi-Public
          path: |
            AetherOS8.7.nds
            AetherOS8.7-Pass3-DSi-Public.zip
