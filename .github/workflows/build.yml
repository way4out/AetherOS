name: Build AetherMod 8.0 Pass 1 for Nintendo DSi
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20241104
    steps:
      - uses: actions/checkout@v4
      - name: Build AetherMod
        run: |
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"
          make clean
          mkdir -p build/include
          make
          test -f AetherMod.nds
          file AetherMod.nds || true
          ls -lh AetherMod.nds
      - name: Stage public-domain Codex corpus
        run: |
          mkdir -p data/AetherMod/codex_stage
          wget -q https://ebible.org/eng-webbe/eng-webbe_readaloud.zip -O /tmp/codex.zip
          unzip -q /tmp/codex.zip -d data/AetherMod/codex_stage
          find data/AetherMod/codex_stage -type f -name '*.txt' -print0 | sort -z | xargs -0 cat > data/AetherMod/codex_full.txt
          test -s data/AetherMod/codex_full.txt
          rm -rf data/AetherMod/codex_stage /tmp/codex.zip
      - name: Package complete SD bundle
        run: |
          mkdir -p deploy/apps/AetherMod
          mkdir -p deploy/data/AetherMod
          cp AetherMod.nds deploy/apps/AetherMod/AetherMod.nds
          cp -r data/AetherMod/. deploy/data/AetherMod/
          cp AETHERMOD.md deploy/AETHERMOD.md
          printf '%s\n' 'Copy the apps/AetherMod and data/AetherMod directories to the DSi SD card.' > deploy/INSTALL.txt
          cd deploy
          zip -r ../AetherMod-8.0-Pass1-DSi-Full-Rollout.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: AetherMod-8.0-Pass1-DSi-Full-Rollout
          path: |
            AetherMod.nds
            AetherMod-8.0-Pass1-DSi-Full-Rollout.zip
