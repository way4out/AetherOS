name: UniverseSimulatorPlus Production Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          set -eux
          docker pull skylyrac/blocksds:slim-latest
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work skylyrac/blocksds:slim-latest bash -c 'COMPILER=$(find /opt/wonderful -type f -name arm-none-eabi-gcc | head -1); test -n "$COMPILER"; export PATH="$(dirname "$COMPILER"):$PATH"; arm-none-eabi-gcc --version | head -1; make'
      - name: Validate
        run: |
          bash ci/validate-aetheros5.sh
          test -s UniverseSimulatorPlus.nds
          python3 - <<'PY'
from pathlib import Path
p=Path("UniverseSimulatorPlus.nds")
target=256*1024*1024
b=bytearray(p.read_bytes())
if len(b) > target:
    raise SystemExit(f"ROM already exceeds target: {len(b)}")
b[0x14] = 11
b.extend(b"\x00" * (target-len(b)))
p.write_bytes(b)
Path("AetherOS-UniverseSimulatorPlus.nds").write_bytes(b)
print("EXPANDED_ROM_BYTES", len(b))
PY
          cp UniverseSimulatorPlus.nds AetherOS-UniverseSimulatorPlus.nds
          test -s AetherOS-UniverseSimulatorPlus.nds
          test "$(stat -c%s UniverseSimulatorPlus.nds)" -ge 268435456
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: UniverseSimulatorPlus-DSi-Verified
          if-no-files-found: error
          path: |
            UniverseSimulatorPlus.nds
            AetherOS-UniverseSimulatorPlus.nds
