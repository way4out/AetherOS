name: UniverseSimulatorPlus Production Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          set -eux
          docker pull skylyrac/blocksds:slim-latest
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work skylyrac/blocksds:slim-latest bash -c 'COMPILER=$(find /opt/wonderful -type f -name arm-none-eabi-gcc | head -1); test -n "$COMPILER"; export PATH="$(dirname "$COMPILER"):$PATH"; arm-none-eabi-gcc --version | head -1; make'
      - name: Expand ROM
        run: |
          set -eux
          sudo chown "$USER":"$USER" UniverseSimulatorPlus.nds
          truncate -s 536870912 UniverseSimulatorPlus.nds
          python3 -c 'from pathlib import Path; p=Path("UniverseSimulatorPlus.nds"); b=bytearray(p.read_bytes()); b[0x14]=12; p.write_bytes(b)'
          cp UniverseSimulatorPlus.nds AetherOS-UniverseSimulatorPlus.nds
          stat -c "%n %s bytes" UniverseSimulatorPlus.nds AetherOS-UniverseSimulatorPlus.nds
      - name: Validate
        run: |
          bash ci/validate-aetheros5.sh
          test -s UniverseSimulatorPlus.nds
          test -s AetherOS-UniverseSimulatorPlus.nds
          test "$(stat -c%s UniverseSimulatorPlus.nds)" -eq 536870912
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: UniverseSimulatorPlus-DSi-QuantumMax-Verified
          if-no-files-found: error
          path: |
            UniverseSimulatorPlus.nds
            AetherOS-UniverseSimulatorPlus.nds
