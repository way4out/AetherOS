name: AetherOS 5 Direct Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Toolchain smoke test
        run: |
          set -euxo pipefail
          docker pull skylyrac/blocksds:slim-latest
          docker run --rm skylyrac/blocksds:slim-latest sh -lc 'command -v arm-none-eabi-gcc && arm-none-eabi-gcc --version | head -1 && echo BLOCKSDS=$BLOCKSDS'
      - name: Build
        run: |
          set -euxo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work skylyrac/blocksds:slim-latest sh -lc 'make clean && make'
          test -s AetherOS5.nds
          ls -lh AetherOS5.nds
      - name: Validate
        run: |
          python3 - <<'PY'
from pathlib import Path
p=Path("AetherOS5.nds").read_bytes()
assert len(p)>0
assert p[0x12] == 2, f"DSi unit code={p[0x12]}"
arm9_off=int.from_bytes(p[0x20:0x24],"little")
arm9_size=int.from_bytes(p[0x2c:0x30],"little")
assert arm9_off and arm9_size and arm9_off+arm9_size<=len(p)
print("NDS_BYTES",len(p))
print("DSI_UNIT_CODE",p[0x12])
print("ARM9_SIZE",arm9_size)
PY
      - name: Publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherOS5-direct-build
          if-no-files-found: error
          path: AetherOS5.nds
