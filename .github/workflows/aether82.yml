name: AetherOS 8.3 Baseline
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20241104
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"
          make clean
          make
          test -f AetherMod8.3.nds
          cp AetherMod8.3.nds AetherOS8.3.nds
      - name: Package
        run: |
          mkdir -p deploy/apps/AetherMod deploy/data/AetherMod
          cp AetherMod8.3.nds deploy/apps/AetherMod/AetherMod8.3.nds
          cp AetherOS8.3.nds deploy/apps/AetherMod/AetherOS8.3.nds
          cp -r data/AetherMod/. deploy/data/AetherMod/
          cp AETHERMOD.md deploy/AETHERMOD.md
          printf '%s\n' 'Launch AetherOS8.3.nds from apps/AetherMod.' > deploy/INSTALL.txt
          cd deploy
          zip -r ../AetherOS8.3-Pass1-DSi-Public.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: AetherOS8.3-Pass1-DSi-Public
          path: |
            AetherMod8.3.nds
            AetherOS8.3.nds
            AetherOS8.3-Pass1-DSi-Public.zip
