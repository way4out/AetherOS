name: AetherOS Actions Runner Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  runner-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Runner online
        run: |
          set -eux
          echo "RUNNER_ONLINE"
          uname -a
          git --version
          docker --version
          docker --version
